name: Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2022
    env:
      PUBLISH_DIR: ${{ github.workspace }}\publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure .NET 9 SDK
        shell: pwsh
        run: |
          $dotnetCommand = Get-Command dotnet -ErrorAction SilentlyContinue
          $hasDotnet9 = $false

          if ($dotnetCommand) {
            $hasDotnet9 = [bool](dotnet --list-sdks | Where-Object { $_ -match '^9\.' } | Select-Object -First 1)
          }

          if (-not $hasDotnet9) {
            $dotnetRoot = Join-Path $env:USERPROFILE ".dotnet"
            Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
            ./dotnet-install.ps1 -Channel 9.0 -InstallDir $dotnetRoot
            $env:PATH = "$dotnetRoot;$dotnetRoot\tools;$env:PATH"
            "DOTNET_ROOT=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
            $dotnetRoot | Out-File -FilePath $env:GITHUB_PATH -Append
            "$dotnetRoot\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

          dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Publish
        run: dotnet publish src/Zadana.Api/Zadana.Api.csproj --configuration Release --output "$env:PUBLISH_DIR" --runtime win-x86 --self-contained false

      - name: Remove server-local files from deploy package
        shell: pwsh
        env:
          PRODUCTION_WEB_CONFIG: ${{ secrets.PRODUCTION_WEB_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_WEB_CONFIG)) {
            Remove-Item -LiteralPath "$env:PUBLISH_DIR\web.config" -Force -ErrorAction SilentlyContinue
          } else {
            Set-Content -Path "$env:PUBLISH_DIR\web.config" -Value $env:PRODUCTION_WEB_CONFIG -Encoding UTF8
          }

          Remove-Item -LiteralPath "$env:PUBLISH_DIR\appsettings.Local.json" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$env:PUBLISH_DIR\publish" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -Path "$env:PUBLISH_DIR\logs" -ItemType Directory -Force | Out-Null
          "Keep this directory so ASP.NET Core stdout logging can create startup logs." | Set-Content -Path "$env:PUBLISH_DIR\logs\.keep"

      - name: Deploy to MonsterASP
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          & $msdeploy `
            -verb:sync `
            -allowUntrusted `
            "-source:contentPath=$env:PUBLISH_DIR" `
            "-dest:contentPath=site57375,computerName=https://site57375.siteasp.net:8172/MsDeploy.axd?site=site57375,username=site57375,password=${{ secrets.SERVER_PASSWORD }},AuthType='Basic'" `
            -enableRule:DoNotDeleteRule `
            -enableRule:AppOffline

      - name: Verify live app and print stdout logs
        if: always()
        shell: pwsh
        run: |
          $healthUrl = "https://zadana.runasp.net/health"
          $healthy = $false

          Start-Sleep -Seconds 10
          try {
            $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 20
            Write-Host "Health check: $($response.StatusCode) $($response.StatusDescription)"
            Write-Host $response.Content
            $healthy = $response.StatusCode -ge 200 -and $response.StatusCode -lt 300
          } catch {
            if ($_.Exception.Response) {
              Write-Host "Health check failed: $([int]$_.Exception.Response.StatusCode) $($_.Exception.Response.StatusDescription)"
            } else {
              Write-Host "Health check failed: $($_.Exception.Message)"
            }
          }

          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $remoteLogs = Join-Path $env:RUNNER_TEMP "remote-logs"
          Remove-Item -LiteralPath $remoteLogs -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -Path $remoteLogs -ItemType Directory -Force | Out-Null

          try {
            & $msdeploy `
              -verb:sync `
              -allowUntrusted `
              "-source:contentPath=site57375\logs,computerName=https://site57375.siteasp.net:8172/MsDeploy.axd?site=site57375,username=site57375,password=${{ secrets.SERVER_PASSWORD }},AuthType='Basic'" `
              "-dest:contentPath=$remoteLogs"
          } catch {
            Write-Host "Could not download remote logs: $($_.Exception.Message)"
          }

          $logs = Get-ChildItem -Path $remoteLogs -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "stdout*" -or $_.Extension -eq ".log" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 5

          if (-not $logs) {
            Write-Host "No stdout logs found under remote logs folder."
          }

          foreach ($log in $logs) {
            Write-Host "----- $($log.FullName) -----"
            Get-Content -Path $log.FullName -Tail 200 -ErrorAction Continue
          }

          if (-not $healthy) {
            exit 1
          }
